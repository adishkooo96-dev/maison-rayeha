<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <script>
      // Prevent Vite HMR disconnect reload loop in iframe / Cloud Run
      (function() {
        if (typeof window !== 'undefined') {
          // Guard window.location.reload against automated loop invocations
          const _origReload = window.location.reload.bind(window.location);
          let _lastReload = 0;
          window.location.reload = function() {
            const now = Date.now();
            if (now - _lastReload < 10000) {
              console.warn('[Maison] Suppressed rapid automated location.reload');
              return;
            }
            _lastReload = now;
            _origReload();
          };

          // Neutralize vite-hmr websockets so failing dev socket connections do not poll
          const _OrigWS = window.WebSocket;
          if (_OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (
                typeof url === 'string' &&
                (protocols === 'vite-hmr' || protocols === 'vite-ping' || url.includes('token='))
              ) {
                return {
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: '',
                  readyState: 3,
                  url: url,
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; },
                  send: function() {},
                  close: function() {},
                };
              }
              return new _OrigWS(url, protocols);
            };
          }
        }
      })();
    </script>
    <script>
      // Apply theme BEFORE first paint to avoid white flash
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved;
          if (!theme || (theme !== 'dark' && theme !== 'light')) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
